name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

      - name: Verify tag matches pyproject version
        id: version
        shell: pwsh
        run: |
          $version = uv run python packaging/make_version_info.py
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match pyproject version $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: uv run python packaging/make_icon.py
      - run: uv run pyinstaller packaging/jarvis.spec --noconfirm --distpath dist --workpath build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: overlay
      - name: Build the overlay into the app folder
        shell: pwsh
        run: ./packaging/build_overlay.ps1 -Dest dist/jarvis

      - name: Build installer
        shell: pwsh
        run: |
          $version = uv run python packaging/make_version_info.py
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$version packaging\jarvis.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem packaging\Output\JarvisSetup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "jarvis-install"
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/TASKS="
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          foreach ($exe in "jarvis.exe", "jarvisw.exe") {
            if (-not (Test-Path (Join-Path $dir $exe))) { Write-Error "$exe missing"; exit 1 }
          }
          & (Join-Path $dir "jarvis.exe") version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $u = Start-Process (Join-Path $dir "unins000.exe") -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($u.ExitCode -ne 0 -or (Test-Path (Join-Path $dir "jarvis.exe"))) {
            Write-Error "uninstall failed"; exit 1
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash packaging\Output\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii packaging\Output\SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            packaging/Output/JarvisSetup-*.exe
            packaging/Output/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
