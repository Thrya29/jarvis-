name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  ui:
    name: UI build is current
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed src/jarvis/ui matches a fresh build of frontend/
        shell: pwsh
        run: |
          git add -A ../src/jarvis/ui
          $changes = git status --porcelain -- ../src/jarvis/ui
          if ($changes) { $changes; Write-Error "Run 'npm run build' in frontend/ and commit src/jarvis/ui"; exit 1 }

  build:
    name: Build executable
    needs: [check, ui]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python packaging/make_version_info.py
      - run: uv run python packaging/make_icon.py
      - run: uv run pyinstaller packaging/jarvis.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test frozen build
        shell: pwsh
        env:
          JARVIS_HOME: ${{ runner.temp }}\jarvis-home
        run: |
          ./dist/jarvis/jarvis.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./dist/jarvis/jarvis.exe config init
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The bundled interpreter used by run_python must have the Office libraries.
          $script = Join-Path $env:RUNNER_TEMP "smoke.py"
          $doc = Join-Path $env:RUNNER_TEMP "smoke.docx"
          "import docx, openpyxl, pypdf, mss, PIL, uiautomation, faster_whisper, ctranslate2, onnxruntime, piper, soxr, livekit.rtc`nfrom jarvis.voice.vad import SileroVAD; SileroVAD()`nimport psutil, maxminddb, pathlib`nfrom jarvis.maps.network import CENTROIDS, GeoDB, snapshot; assert CENTROIDS['IN']; snapshot(GeoDB(pathlib.Path('.')))`ndocx.Document().save(r'$doc')`nprint('ok')" | Set-Content -Encoding utf8 $script
          ./dist/jarvis/jarvis.exe _pyexec $script
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $doc)) { exit 1 }
      - name: Build installer
        shell: pwsh
        run: |
          $version = uv run python packaging/make_version_info.py
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$version packaging\jarvis.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem packaging\Output\JarvisSetup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "jarvis-install"
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/TASKS="
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          foreach ($exe in "jarvis.exe", "jarvisw.exe") {
            if (-not (Test-Path (Join-Path $dir $exe))) { Write-Error "$exe missing"; exit 1 }
          }
          & (Join-Path $dir "jarvis.exe") version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $u = Start-Process (Join-Path $dir "unins000.exe") -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($u.ExitCode -ne 0 -or (Test-Path (Join-Path $dir "jarvis.exe"))) {
            Write-Error "uninstall failed"; exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: JarvisSetup-windows-x64
          path: packaging/Output/JarvisSetup-*.exe
          retention-days: 7
